name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev build-essential

      - name: Build standard and compact binaries
        run: |
          make -j$(nproc)
          make small -j$(nproc)

      - name: Package Linux assets
        run: |
          mkdir -p release
          tar -czvf release/sankram-${{ github.ref_name }}-linux-x86_64.tar.gz -C build sankram sankram_small

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: release/*.tar.gz

  build-macos:
    name: Build macOS (Apple Silicon / arm64)
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build macOS standard and compact binaries
        run: |
          make -j$(sysctl -n hw.ncpu)
          make small -j$(sysctl -n hw.ncpu)

      - name: Package macOS assets
        run: |
          mkdir -p release
          tar -czvf release/sankram-${{ github.ref_name }}-macos-arm64.tar.gz -C build sankram sankram_small

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release/*.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup MinGW MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      - name: Build Windows binaries with make
        shell: msys2 {0}
        run: |
          make -j
          make small -j

      - name: Package Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path build/sankram.exe, build/sankram_small.exe -DestinationPath "release/sankram-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

