<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sankram Edge Gateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      padding: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .window {
      width: 1100px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #0f172a;
    }
    .titlebar {
      background: #1e293b;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 16px;
    }
    .traffic-lights {
      display: flex;
      gap: 8px;
    }
    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .light.red { background: #ef4444; }
    .light.yellow { background: #f59e0b; }
    .light.green { background: #10b981; }
    .address-bar {
      flex: 1;
      background: #0f172a;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 8px;
    }
    .lock { color: #10b981; }
    .content {
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      max-width: 580px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .stats {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }
    .stat-card {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
    }
    .stat-val { font-size: 26px; font-weight: 800; color: #10b981; }
    .stat-lbl { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
      </div>
      <div class="address-bar">
        <span class="lock">🔒</span>
        <span>http://127.0.0.1:18080/</span>
      </div>
    </div>
    <div class="content">
      <div class="badge">संक्रम • SANKRAM EDGE GATEWAY</div>
      <h1>Drop-in High-Performance Proxy</h1>
      <p>Static File Engine & Reverse Proxy with Zero-Copy Linux sendfile & WebSocket RFC 6455 Tunneling</p>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-val">103k+</div>
          <div class="stat-lbl">Requests / Sec</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">61 KB</div>
          <div class="stat-lbl">Binary Size</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">0B</div>
          <div class="stat-lbl">Struct Growth</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
