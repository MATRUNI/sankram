<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sankram Edge Gateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 44px;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-align: center;
    }
    p {
      color: #94a3b8;
      font-size: 18px;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 800px;
      width: 100%;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .metric {
      font-size: 32px;
      font-weight: 800;
      color: #10b981;
      margin-bottom: 8px;
    }
    .label {
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="badge">संक्रम • SANKRAM EDGE GATEWAY</div>
  <h1>Drop-in High-Performance Proxy</h1>
  <p>Static File Engine & Reverse Proxy with Zero-Copy Linux sendfile & WebSocket RFC 6455 Tunneling</p>
  <div class="grid">
    <div class="card">
      <div class="metric">103k+</div>
      <div class="label">Requests / Sec</div>
    </div>
    <div class="card">
      <div class="metric">61 KB</div>
      <div class="label">Binary Footprint</div>
    </div>
    <div class="card">
      <div class="metric">0B</div>
      <div class="label">Struct Growth</div>
    </div>
  </div>
</body>
</html>
